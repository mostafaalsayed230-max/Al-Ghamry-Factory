name: Build Al-Ghamry GUI App

on:
  push:
    branches: [main]
  release:
    types: [published]

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      # ✅ تعديل لإنشاء مجلد dist في PowerShell
      - name: Prepare dist folder
        run: |
          if (-not (Test-Path dist)) { New-Item -ItemType Directory -Name dist }

      - name: Build EXE with PyInstaller
        run: |
          pyinstaller --onefile --windowed --name AlGhamryApp app.py

      - name: Upload EXE artifact
        uses: actions/upload-artifact@v4
        with:
          name: AlGhamry-App
          path: dist/AlGhamryApp.exe
